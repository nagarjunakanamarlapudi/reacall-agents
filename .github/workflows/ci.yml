name: Offline verification

on:
  push:
  pull_request:

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked uv toolchain
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Install locked Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-groups
          npm ci
      - name: Prepare canonical Linux diagram renderer
        run: ./scripts/render_diagrams.sh --check-runtime
      - name: Run credential-free RecallOps gates
        run: |
          make -n security | grep -F "uv export --locked --no-dev --no-emit-project"
          make ci
      - name: Report development-only Mermaid and Puppeteer advisories
        if: always()
        run: |
          npm audit --omit=dev
          npm audit || echo "::warning::Development-tool advisories are reported separately; production dependencies were audited above."
