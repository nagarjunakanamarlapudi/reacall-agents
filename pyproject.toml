[project]
name = "recallops"
version = "0.1.0"
description = "Evidence-first, simulated food recall operations demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents>=0.7.3,<0.8",
  "fastmcp>=3.2.0,<4",
  "httpx>=0.28,<1",
  "langchain-core>=1.0,<2",
  "langchain-mcp-adapters>=0.2,<0.3",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph==1.2.11",
  "pydantic>=2.12,<3",
  "scikit-learn>=1.8,<2",
  "streamlit>=1.49,<2",
]

[project.scripts]
recallops = "recallops.cli:main"

[dependency-groups]
dev = [
  "ipykernel>=7.0,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["notebooks/*.ipynb"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
